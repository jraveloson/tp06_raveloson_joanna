<h2>Liste des utilisateurs</h2>
<button routerLink="/utilisateurs/add">Ajouter Utilisateur</button>

<ul *ngIf="utilisateurs$ | async as utilisateurs; else loading">
    <li *ngFor="let u of utilisateurs" [routerLink]="['/login']">
        {{ u.nom }} {{ u.prenom }}
    </li>
</ul>
<button routerLink="/pollutions">Retour</button>

<ng-template #loading>Chargement…</ng-template>
